<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yes or No?</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
#app {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  position: relative;
  isolation: isolate;
  background-color: light-dark(#fff7fb, #120e16);
  background-image: radial-gradient(circle at 15% 15%, light-dark(#ffd6e8, #3b1d31) 0, transparent 34%), radial-gradient(circle at 85% 85%, light-dark(#dcd7ff, #211d40) 0, transparent 34%);
  color: light-dark(#171923, #f4f5f7);
  overflow: auto;
}
.heart { position: absolute; font-size: 28px; opacity: .45; animation: float 5s ease-in-out infinite; pointer-events: none; }
.heart.one { top: 13%; left: 12%; }
.heart.two { top: 22%; right: 12%; animation-delay: -2s; }
.heart.three { bottom: 13%; left: 18%; animation-delay: -3.5s; }
@keyframes float { 50% { transform: translateY(-12px) rotate(7deg); } }
.card {
  width: min(94vw, 460px);
  text-align: center;
  padding: 36px 24px 32px;
  border: 1px solid light-dark(rgba(255,255,255,.8), rgba(255,255,255,.1));
  border-radius: 30px;
  background: light-dark(rgba(255,255,255,.7), rgba(28,21,34,.76));
  box-shadow: 0 24px 70px light-dark(rgba(139,64,108,.18), rgba(0,0,0,.35));
  backdrop-filter: blur(18px);
}
h1 { margin: 0 0 12px; font-size: clamp(30px, 8vw, 42px); line-height: 1.1; letter-spacing: -.04em; }
#message { margin-top: -2px; margin-bottom: 26px; font-size: 16px; opacity: .68; }
.love-gif { display: none; width: min(270px, 72vw); margin: 4px auto 18px; border-radius: 22px; overflow: hidden; }
.love-gif img { display: block; width: 150px; height: 150px; margin: 0 auto; object-fit: contain; }
.love-gif img:not(.uploaded-love) { display: none; }
.love-gif img.uploaded-love { width: min(270px, 72vw); height: auto; }
.card:has(.love-gif[style*="display: block"]) #message { margin-top: 0; margin-bottom: 0; font-size: 17px; font-weight: 600; }
.button-area {
  position: relative;
  width: 100%;
  height: 190px;
  margin-top: 6px;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
button {
  position: absolute;
  border: 0;
  border-radius: 16px;
  padding: 14px 28px;
  min-width: 105px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  box-shadow: 0 10px 24px rgba(0,0,0,.12);
  transition: left .42s cubic-bezier(.22,.8,.25,1), top .42s cubic-bezier(.22,.8,.25,1), transform .12s ease, box-shadow .2s ease;
}
button:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,.16); }
button:active { transform: scale(.96); }
#yes {
  left: 0;
  top: 72px;
  background: linear-gradient(135deg, #ff4f91, #ff6b6b);
  color: white;
}
#no {
  left: 0;
  top: 72px;
  background: light-dark(#ffffff, #29232f);
  color: light-dark(#6c5868, #f2eaf3);
  border: 1px solid light-dark(#eadde5, #443748);
}
</style>
</head>
<body>
<main id="app">
  <div class="heart one">♡</div>
  <div class="heart two">♥</div>
  <div class="heart three">♡</div>
  <section class="card" aria-live="polite">
    <h1 id="question">Do you like me? ❤️</h1>
    <div class="love-gif">
      <img class="uploaded-love" src="love_img.jpg" alt="Love you">
    </div>
    <div id="message">Be honest... there is only one right answer 😌</div>
    <div class="button-area" id="buttonArea">
      <button id="yes" type="button">Yes</button>
      <button id="no" type="button">No</button>
    </div>
  </section>
</main>
<script>
const area = document.getElementById('buttonArea');
const yes = document.getElementById('yes');
const no = document.getElementById('no');
const question = document.getElementById('question');
const message = document.getElementById('message');
let noActivated = false;

function setInitialPositions() {
  const gap = 14;
  const totalWidth = yes.offsetWidth + no.offsetWidth + gap;
  const startX = Math.max(0, (area.clientWidth - totalWidth) / 2);
  yes.style.left = `${startX}px`;
  no.style.left = `${startX + yes.offsetWidth + gap}px`;
  yes.style.top = '72px';
  no.style.top = '72px';
}

requestAnimationFrame(setInitialPositions);

function moveNo() {
  const pad = 4;
  const maxX = Math.max(pad, area.clientWidth - no.offsetWidth - pad);
  const maxY = Math.max(pad, area.clientHeight - no.offsetHeight - pad);
  const yesX = yes.offsetLeft;
  const yesY = yes.offsetTop;
  const yesRight = yesX + yes.offsetWidth;
  const yesBottom = yesY + yes.offsetHeight;
  const currentX = no.offsetLeft;
  const currentY = no.offsetTop;
  const minDistance = Math.min(120, Math.max(70, Math.min(maxX, maxY) * 0.55));

  let x = pad;
  let y = pad;
  for (let attempt = 0; attempt < 100; attempt++) {
    x = pad + Math.random() * Math.max(0, maxX - pad);
    y = pad + Math.random() * Math.max(0, maxY - pad);
    const overlapsYes = x < yesRight && x + no.offsetWidth > yesX &&
      y < yesBottom && y + no.offsetHeight > yesY;
    const distance = Math.hypot(x - currentX, y - currentY);
    if (!overlapsYes && distance >= minDistance) break;
  }
  no.style.left = `${x}px`;
  no.style.top = `${y}px`;
}

no.addEventListener('mouseenter', () => {
  if (noActivated) moveNo();
});
no.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  noActivated = true;
  moveNo();
});
no.addEventListener('pointerup', (event) => {
  event.preventDefault();
  noActivated = true;
  moveNo();
});
no.addEventListener('click', (event) => {
  event.preventDefault();
  noActivated = true;
  moveNo();
});

yes.addEventListener('click', () => {
  question.textContent = 'Yay! I knew you would say YES! 🥰❤️';
  message.textContent = 'You made the right choice! 😄';
  loveGif.style.display = 'block';
  yes.style.display = 'none';
  no.style.display = 'none';
  area.style.display = 'none';
});

const loveGif = document.querySelector('.love-gif');

window.addEventListener('resize', () => {
  if (no.style.display !== 'none') {
    if (noActivated) moveNo();
    else setInitialPositions();
  }
});
</script>
</body>
</html>
